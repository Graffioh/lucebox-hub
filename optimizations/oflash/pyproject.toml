# Standalone uv project (NOT a workspace member, like optimizations/spark):
# the root workspace pins torch to the pytorch-cu128 index, which would break
# the ROCm torch this trainer needs on the Strix Halo iGPU. The engine half
# of OFlash lives in ../../server/; this package only consumes the shm ring
# and produces adapter files (formats: server/src/common/oflash/oflash_format.h).
[project]
name = "oflash"
version = "0.1.0"
description = "Luce OFlash — online DFlash drafter adaptation trainer sidecar"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "lucebox" }]
keywords = ["speculative-decoding", "lora", "online-learning", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
# The low-precision mirror + LoRA training loop. gguf provides GGUF parsing and
# dequantization (Q4_K/Q6_K/Q8_0 → f32) for the drafter mirror and the
# target's lm_head/token_embd. torch: install the ROCm build for iGPU
# training (see README) — the CPU build works at reduced cadence.
train = [
    "torch>=2.4",
    "gguf>=0.10",
]
dev = [
    "pytest>=8",
    # Trainer state tests import the real torch-backed implementation. ROCm
    # users may preinstall AMD's wheel and it will satisfy this requirement.
    "torch>=2.4",
    "gguf>=0.10",
]

[project.urls]
Homepage = "https://github.com/Luce-Org/lucebox-hub"
Source = "https://github.com/Luce-Org/lucebox-hub/tree/main/optimizations/oflash"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["oflash*"]
